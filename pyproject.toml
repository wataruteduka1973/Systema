[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "System_Config.test_settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "unit: external I/Oを伴わない単体テスト",
    "integration: DjangoやDBを使用する結合テスト",
    "e2e: ブラウザや起動済みサーバーを使用するE2Eテスト",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["Main/migrations", "document/build", "staticfiles", "models.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"Main/models/__init__.py" = ["F403"]
"Main/views/__init__.py" = ["F403"]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "Main/migrations|document/build|staticfiles|models.py"

[tool.mypy]
python_version = "3.13"
files = ["Main/domain", "Main/services", "Main/infrastructure"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["Main"]
omit = ["Main/migrations/*", "Main/apps.py", "Main/admin.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 35
