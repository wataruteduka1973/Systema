<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情報分析ツール システマ</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<style>
    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(135deg, #ffffff, #f9f9f9);
        color: #333;
        min-height: 100vh;
    }

    .hero-section {
        background: linear-gradient(135deg, #ff4d4d, #ff8c8c);
        color: #fff;
        padding: 5rem 1rem;
        text-align: center;
        margin-bottom: 2rem;
    }

    .hero-section h1 {
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 1rem;
    }

    .search-day {
        margin-top: 20px;
        font-size: 1rem;
        color: #333;
    }

    #priceChartContainer svg {
        width: 100%;
        max-width: 1300px;
        height: auto;
        aspect-ratio: 2.6 / 1;
        background-color: #f8f9fa;
        border-radius: 15px;
        padding: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin: 20px auto;
        display: block;
    }

    #priceChartContainer .bar {
        fill: steelblue;
        transition: fill 0.3s;
    }

    #priceChartContainer .bar:hover {
        fill: #005f99;
    }

    #priceChartContainer .label {
        font-size: 14px;
        fill: #333;
    }

    #priceChartContainer .axis text {
        font-size: 14px;
        fill: #333;
    }

    #priceChartContainer .axis path,
    #priceChartContainer .axis line {
        stroke: #333;
    }

    .wordcloud-container {
        width: 1300px;
        aspect-ratio: 2 / 1;
        background-color: #f8f9fa;
        border-radius: 15px;
        padding: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin: 20px auto;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #wordcloud {
        width: 100%;
        height: 100%;
    }

    @media (max-width: 1024px) {
        .wordcloud-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 2 / 1;
        }
    }

    @media (max-width: 768px) {
        .wordcloud-container {
            width: 100%;
            aspect-ratio: 1.5 / 1;
            padding: 10px;
        }
    }

    @media (max-width: 576px) {
        .wordcloud-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            padding: 5px;
        }
    }
</style>

<body>
    {% include 'header.html' %}
    <main role="main">
        <section class="hero-section">
            <div class="container">
                <h1>ヤフオク情報分析</h1>
                <p class="lead">取得したデータからより深い分析を行います</p>
            </div>
        </section>
        <div class="container search-container">
            <div class="form-group mt-4 d-flex gap-2 align-items-center">
                <h3>関連項目</h3>
                <a href="{% url 'yahuoku' %}" class="btn btn-danger">相場検索</a>
                <a href="{% url 'yahuoku_history' %}" class="btn btn-danger">過去データ参照</a>
            </div>
            <h2>過去の検索ワード</h2>
            <div class="form-group">
                <label for="searchWordDropdown">検索ワードを選択:</label>
                <select id="searchWordDropdown" class="form-control">
                    <option value="">選択してください</option>
                </select>
            </div>
            <div class="form-group mt-4 d-flex gap-2 align-items-center">
                <button id="analyzeMarketPrice" class="btn btn-info">相場の分析</button>
                <button id="updateMarketData" class="btn btn-success">
                    相場データの更新
                    <span id="updateSpinner" class="spinner-border spinner-border-sm" style="display:none;"
                        role="status"></span>
                </button>
                <button id="deleteMarketData" class="btn btn-warning">相場データの削除</button>
            </div>
            <div class="mt-5 text-center">
                <h2>よく用いられるキーワード</h2>
            </div>
            <div class="wordcloud-container">
                <div id="wordcloud"></div>
            </div>
            <div id="priceChartContainer" class="mt-5 text-center">
                <h3>価格分布</h3>
                <div id="priceChart"></div>
            </div>
            <div class="search-day mt-4 container">
                <p>最終更新日: <span id="searchDay"></span></p>
            </div>
        </div>
    </main>
    {% include 'footer.html' %}
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="{% static 'JS/Deep_Analysis.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-cloud@1.2.5/build/d3.layout.cloud.js"></script>
</body>

</html>
