{% extends 'base.html' %}
{% load static %}

{% block title %}通知 | Systema{% endblock %}

{% block extra_head %}
    <style>
        .notification-card { border-left: .3rem solid transparent; }
        .notification-card.is-unread { border-left-color: #c2532c; background: #fbf1ea; }
        .notification-message { overflow-wrap: anywhere; }
        .notification-candidate { display: flex; gap: .75rem; align-items: flex-start; }
        .candidate-image { flex: 0 0 72px; width: 72px; height: 72px; border-radius: .5rem; background: var(--systema-bg); border: 1px solid var(--systema-border); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: .7rem; color: var(--systema-muted); }
        .candidate-image img { width: 100%; height: 100%; object-fit: cover; }
        .candidate-body { min-width: 0; flex: 1 1 auto; }
        .candidate-name { font-weight: 600; overflow-wrap: anywhere; color: var(--systema-text); }
        .compare-chip { display: inline-block; border-radius: 999px; padding: .05rem .5rem; font-size: .75rem; font-weight: 600; border: 1px solid var(--systema-border); }
        .compare-chip.below { background: var(--systema-teal-soft); border-color: var(--systema-teal); color: #1d5c4c; }
        .compare-chip.above { background: var(--systema-coral-soft); border-color: var(--systema-coral); color: #7a2a1c; }
    </style>
{% endblock %}

{% block body_attrs %} class="bg-light"{% endblock %}

{% block content %}
    <main class="container py-4" style="max-width: 900px">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <div>
                <h1 class="h2 mb-1">通知</h1>
                <p class="text-muted mb-0">値下げ、終了間近、保存検索とアラートの結果を確認できます。</p>
            </div>
            <button id="markAllRead" class="btn btn-outline-primary" type="button">すべて既読にする</button>
        </div>
        <div id="notificationCategories" class="nav nav-pills gap-2 mb-3" role="group" aria-label="通知の種類">
            <button type="button" class="nav-link active" data-category="" aria-pressed="true">すべて</button>
            <button type="button" class="nav-link" data-category="alert" aria-pressed="false">アラート</button>
            <button type="button" class="nav-link" data-category="failure" aria-pressed="false">取得の失敗</button>
            <button type="button" class="nav-link" data-category="watch" aria-pressed="false">ウォッチ</button>
            <button type="button" class="nav-link" data-category="update" aria-pressed="false">更新のまとめ</button>
        </div>
        <div class="form-check form-switch mb-3">
            <input id="unreadOnly" class="form-check-input" type="checkbox">
            <label class="form-check-label" for="unreadOnly">未読だけ表示</label>
        </div>
        <div id="notificationMessage" class="alert d-none" role="status" aria-live="polite"></div>
        <div id="notificationList" class="d-grid gap-3" aria-live="polite"></div>
        <nav class="d-flex justify-content-between mt-4" aria-label="通知ページ">
            <button id="previousPage" class="btn btn-outline-secondary" type="button">前へ</button>
            <span id="pageStatus" class="align-self-center text-muted"></span>
            <button id="nextPage" class="btn btn-outline-secondary" type="button">次へ</button>
        </nav>
    </main>
{% endblock %}

{% block scripts %}
    <script src="{% static 'JS/Notifications.js' %}?v=20261013-readable"></script>
{% endblock %}
