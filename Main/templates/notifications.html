{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>通知 | Systema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .notification-card { border-left: .3rem solid transparent; }
        .notification-card.is-unread { border-left-color: #0d6efd; background: #f7faff; }
        .notification-message { overflow-wrap: anywhere; }
    </style>
</head>
<body class="bg-light">
    {% include 'header.html' %}
    <main class="container py-4" style="max-width: 900px">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <div>
                <h1 class="h2 mb-1">通知</h1>
                <p class="text-muted mb-0">値下げ、終了間近、保存検索の結果を確認できます。</p>
            </div>
            <button id="markAllRead" class="btn btn-outline-primary" type="button">すべて既読にする</button>
        </div>
        <div class="form-check form-switch mb-3">
            <input id="unreadOnly" class="form-check-input" type="checkbox">
            <label class="form-check-label" for="unreadOnly">未読だけ表示</label>
        </div>
        <div id="notificationMessage" class="alert d-none" role="status" aria-live="polite"></div>
        <div id="notificationList" class="d-grid gap-3" aria-live="polite"></div>
        <nav class="d-flex justify-content-between mt-4" aria-label="通知ページ">
            <button id="previousPage" class="btn btn-outline-secondary" type="button">前へ</button>
            <span id="pageStatus" class="align-self-center text-muted"></span>
            <button id="nextPage" class="btn btn-outline-secondary" type="button">次へ</button>
        </nav>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'JS/Notifications.js' %}?v=20260909-phase5"></script>
</body>
</html>
