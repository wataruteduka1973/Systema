<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    {% load static %}
    <link href="{% static 'css/header.css' %}" rel="stylesheet">
    <link href="{% static 'css/footer.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <title>情報分析ツール システマ</title>
    <style>
        body {
            background-color: rgb(205, 69, 69);
            font-family: 'Roboto', sans-serif;
        }

        .jumbotron {
            background-color: #e6e6e6;
            padding: 2rem 1rem;
        }

        .btn-custom {
            background-color: #000000;
            border: 1px solid #ced4da;
            color: #ffffff;
            padding: 0.5rem 1rem;
            font-size: 1.1rem;
        }

        .btn-custom:hover {
            background-color: #343a40;
            color: #ffffff;
        }

        .btn-custom .bi-search- {
            color: #ffffff;
        }

        .d-flex.gap-2>.btn {
            min-width: 0;
        }

        .form-check {
            margin-bottom: 10px;
        }

        .search-container {
            max-width: 100%;
            padding: 0 1rem;
        }

        .chart-container {
            margin: 2rem 0;
            max-width: 100%;
            width: 1600px;
            height: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            background-color: #535252;
        }

        .chart-annotation {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 1;
        }

        .table-container {
            margin: 2rem 0;
        }

        @media (max-width: 768px) {
            .input-group .form-control {
                min-width: 150px;
            }

            .chart-container {
                width: 100%;
                height: 300px;
            }
        }
    </style>
</head>

<body>
    {% include 'header.html' %}
    <main role="main">
        <section class="text-center jumbotron">
            <div class="container">
                <h1 class="jumbotron-heading">相場予想</h1>
                <p class="lead text-muted">既存の相場情報を参照して今後の商品価格を予想します</p>
            </div>
        </section>
        <div class="container search-container">
            <div class="form-group mt-4 d-flex gap-2 align-items-center">
                <h3>関連項目</h3>
                <a href="{% url 'yahuoku_now' %}" class="btn btn-light">相場検索</a>
                <a href="{% url 'yahuoku_now' %}" class="btn btn-light">現在価格検索</a>
                <a href="{% url 'Deep_Analysis_now' %}" class="btn btn-light">ターゲット分析</a>
            </div>
            <div class="form-group mt-4 d-flex gap-2 align-items-center">
            </div>
            <h2>キーワードの行間を開けると詳細に検索できます</h2>
            <div class="row justify-content-center search-button">
                <div class="col-12">
                    <div class="col-md-8">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" id="search" placeholder="検索キーワード"
                                aria-label="検索キーワード" aria-describedby="button-search">
                            <button class="btn btn-custom" type="button" id="button-search"
                                onclick="Prediction_Search()">
                                <span class="spinner-border spinner-border-sm" role="status" id="searchSpinner"
                                    style="display: none;"></span>
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                    class="bi bi-search" viewBox="0 0 16 16">
                                    <path
                                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="predictionChart"></canvas>
            </div>
            <div class="table-container">
                <table class="table table-striped" id="predictionTable">
                    <thead>
                        <tr>
                            <th>項目</th>
                            <th>値</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>
    {% include 'footer.html' %}
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="{% static 'JS/Yahuoku_prediction.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
