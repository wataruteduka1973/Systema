<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    {% load static %}
    <link href="{% static 'css/header.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <title>情報分析ツール システマ</title>
    <style>
        body {
            background-color: rgb(205, 69, 69);
            font-family: 'Roboto', sans-serif;
        }

        .jumbotron {
            background-color: #e6e6e6;
            padding: 2rem 1rem;
        }

        .pagination .page-item .page-link {
            color: #000000;
        }

        .btn-custom {
            background-color: #000000;
            border: 1px solid #ced4da;
            color: #ffffff;
            padding: 0.5rem 1rem;
            font-size: 1.1rem;
        }

        .btn-custom:hover {
            background-color: #343a40;
            color: #ffffff;
        }

        .btn-custom .bi-search- {
            color: #ffffff;
        }

        .d-flex.gap-2>.btn {
            min-width: 0;
        }

        .form-check {
            margin-bottom: 10px;
        }


        #medianPrice {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background-color: #cc4771;
        }

        .search-container {
            max-width: 100%;
            padding: 0 1rem;
        }

        @media (max-width: 768px) {

            .input-group .form-control {
                min-width: 150px;

            }

            #dataTableContainer {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>
    {% include 'header.html' %}
    <main role="main">

        <section class="text-center jumbotron">
            <div class="container">
                <h1 class="jumbotron-heading">ヤフオク相場検索</h1>
                <p class="lead text-muted">オークションが終了した商品の情報から売れる商品の傾向を分析します。</p>
            </div>
        </section>

        <div class="container search-container">
            <h2>キーワードの行間を開けると詳細に検索できます</h2>
            <div class="row justify-content-center search-button">
                <div class="col-12">
                    <div class="col-md-8">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" id="search" placeholder="検索キーワード"
                                aria-label="検索キーワード" aria-describedby="button-search">
                            <button class="btn btn-custom" type="button" id="button-search" onclick="performSearch()">
                                <span class="spinner-border spinner-border-sm" role="status" id="searchSpinner"
                                    style="display: none;"></span>
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                    class="bi bi-search" viewBox="0 0 16 16">
                                    <path
                                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>価格範囲 (円):</label>
                    <div class="input-group mb-2">
                        <input type="number" class="form-control" id="minPrice" placeholder="最低価格" min="0" value="0">
                        <span class="input-group-text">〜</span>
                        <input type="number" class="form-control" id="maxPrice" placeholder="最高価格" min="0">
                    </div>
                    <button class="btn btn-primary me-2" onclick="validateAndFilterData()">絞り込む</button>
                    <button class="btn btn-secondary" onclick="clearFilters()">フィルターをリセット</button>
                </div>
                <div class="col-md-6">
                    <label>入札数:</label>
                    <div class="row">
                        <div class="col-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="bid0_10" onchange="filterData()">
                                <label class="form-check-label" for="bid0_10">0-10</label>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="bid10_20" onchange="filterData()">
                                <label class="form-check-label" for="bid10_20">10-20</label>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="bid20_30" onchange="filterData()">
                                <label class="form-check-label" for="bid20_30">20-30</label>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="bid30_40" onchange="filterData()">
                                <label class="form-check-label" for="bid30_40">30-40</label>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="bid40_50" onchange="filterData()">
                                <label class="form-check-label" for="bid40_50">40-50</label>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="bid50_plus" onchange="filterData()">
                                <label class="form-check-label" for="bid50_plus">50以上</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="Main-Element">
                <div id="medianPrice" class="alert alert-info"></div>
                <div id="dataTableContainer">
                    <table id="dataTable" class="table table-striped table-hover table-container">
                        <thead>
                            <tr>
                                <th style="width:200px;">商品名</th>
                                <th style="width:150px;">終了価格
                                    <button class="btn btn-sm btn-outline-secondary sort-btn" data-sort="price"
                                        data-order="asc">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-sort-down" viewBox="0 0 16 16">
                                            <path
                                                d="M3.5 2.5a.5.5 0 0 0-1 0v8.793l-1.146-1.147a.5.5 0 0 0-.708.708l2 1.999.007.007a.497.497 0 0 0 .7-.006l2-2a.5.5 0 0 0-.707-.708L3.5 11.293V2.5zm3.5 1a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zM7.5 6a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1h-5zm0 3a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1h-3zm0 3a.5.5 0 0 0 0 1h1a.5.5 0 0 0 0-1h-1z" />
                                        </svg>
                                    </button>
                                </th>
                                <th style="width:150px;">開始価格
                                    <button class="btn btn-sm btn-outline-secondary sort-btn" data-sort="startPrice"
                                        data-order="asc">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-sort-down" viewBox="0 0 16 16">
                                            <path
                                                d="M3.5 2.5a.5.5 0 0 0-1 0v8.793l-1.146-1.147a.5.5 0 0 0-.708.708l2 1.999.007.007a.497.497 0 0 0 .7-.006l2-2a.5.5 0 0 0-.707-.708L3.5 11.293V2.5zm3.5 1a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zM7.5 6a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1h-5zm0 3a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1h-3zm0 3a.5.5 0 0 0 0 1h1a.5.5 0 0 0 0-1h-1z" />
                                        </svg>
                                    </button>
                                </th>
                                <th style="width:150px;">入札
                                    <button class="btn btn-sm btn-outline-secondary sort-btn" data-sort="bidding"
                                        data-order="asc">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-sort-down" viewBox="0 0 16 16">
                                            <path
                                                d="M3.5 2.5a.5.5 0 0 0-1 0v8.793l-1.146-1.147a.5.5 0 0 0-.708.708l2 1.999.007.007a.497.497 0 0 0 .7-.006l2-2a.5.5 0 0 0-.707-.708L3.5 11.293V2.5zm3.5 1a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zM7.5 6a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1h-5zm0 3a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1h-3zm0 3a.5.5 0 0 0 0 1h1a.5.5 0 0 0 0-1h-1z" />
                                        </svg>
                                    </button>
                                </th>
                                <th style="width:200px;">URL
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    {% include 'footer.html' %}
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="{% static 'JS/YahuokuSetting.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-cloud@1.2.5/build/d3.layout.cloud.js"></script>
</body>

</html>
