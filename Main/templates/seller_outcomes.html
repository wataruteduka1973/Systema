{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>販売実績分析 | Systema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'header.html' %}
    <main class="container py-4 pb-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
            <div><h1 class="h2 mb-1">販売実績分析</h1><p class="text-muted mb-0">確定した販売結果から、売上・費用・純利益を集計します。</p></div>
            <a class="btn btn-outline-primary" href="{% url 'seller_management' %}">出品・在庫管理へ</a>
        </div>
        <div id="outcomeMessage" class="alert d-none" role="status"></div>
        <section aria-label="販売実績の合計" class="mb-4"><div id="outcomeSummary" class="row g-3"></div></section>
        <section class="card mb-4" aria-labelledby="categoryHeading"><div class="card-body"><h2 id="categoryHeading" class="h4">カテゴリ別の実績</h2><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>カテゴリ</th><th>販売件数</th><th>売上</th><th>費用</th><th>純利益</th></tr></thead><tbody id="outcomeCategories"></tbody></table></div></div></section>
        <section class="card" aria-labelledby="lowProfitHeading"><div class="card-body"><h2 id="lowProfitHeading" class="h4">利益が低い販売結果</h2><p class="text-muted">純利益の低い順に最大10件を表示します。</p><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>商品</th><th>カテゴリ</th><th>販売日</th><th>落札額</th><th>費用</th><th>純利益</th></tr></thead><tbody id="outcomeLowProfit"></tbody></table></div></div></section>
    </main>
    <script src="{% static 'JS/SellerOutcomes.js' %}"></script>
</body>
</html>
