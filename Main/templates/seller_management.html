{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>出品・在庫管理 | Systema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section { background: linear-gradient(135deg, #1f2937, #374151); color: white; padding: 2.5rem 0; }
        .inventory-card { border: 0; box-shadow: 0 .2rem .8rem rgba(0, 0, 0, .08); }
        .money-result { font-size: 1.1rem; }
    </style>
</head>
<body class="bg-light">
    {% include 'header.html' %}
    <main>
        <section class="hero-section mb-4">
            <div class="container">
                <h1>出品・在庫管理</h1>
                <p class="lead mb-0">購入候補を在庫へ移し、仕入情報と出品前の見込み利益を管理します。</p>
            </div>
        </section>

        <div class="container mb-5">
            <div id="inventoryMessage" class="alert d-none" role="status"></div>
            <section class="row g-4 mb-4" aria-label="在庫登録">
                <div class="col-lg-6">
                    <div class="card inventory-card h-100">
                        <div class="card-header fw-bold">購入候補から在庫へ</div>
                        <form id="watchConversionForm" class="card-body">
                            {% csrf_token %}
                            <label for="watchItemSelect" class="form-label">追跡中の購入候補</label>
                            <select id="watchItemSelect" class="form-select mb-3" required></select>
                            <label for="watchAcquisitionCost" class="form-label">実際の仕入価格</label>
                            <input id="watchAcquisitionCost" class="form-control mb-3" type="number" min="0" required>
                            <button class="btn btn-primary" type="submit">仕入済み在庫へ移す</button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card inventory-card h-100">
                        <div class="card-header fw-bold">在庫を手動登録</div>
                        <form id="inventoryCreateForm" class="card-body row g-2">
                            {% csrf_token %}
                            <div class="col-12"><label class="form-label" for="inventoryName">商品名</label><input id="inventoryName" class="form-control" maxlength="1000" required></div>
                            <div class="col-sm-6"><label class="form-label" for="inventoryCost">仕入価格</label><input id="inventoryCost" class="form-control" type="number" min="0" required></div>
                            <div class="col-sm-6"><label class="form-label" for="inventoryCategory">カテゴリ</label><input id="inventoryCategory" class="form-control" maxlength="100"></div>
                            <div class="col-12"><label class="form-label" for="inventoryNote">メモ</label><textarea id="inventoryNote" class="form-control" maxlength="2000"></textarea></div>
                            <div class="col-12"><button class="btn btn-outline-primary" type="submit">在庫を登録</button></div>
                        </form>
                    </div>
                </div>
            </section>

            <section aria-labelledby="inventoryHeading">
                <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
                    <div><h2 id="inventoryHeading" class="h3 mb-1">在庫一覧</h2><p class="text-muted mb-0">費用を入力して、出品前の損益分岐価格と見込み利益を確認できます。</p></div>
                    <div><label for="inventoryStatusFilter" class="form-label">状態</label><select id="inventoryStatusFilter" class="form-select" onchange="loadInventory()"><option value="">すべて</option><option value="planned">購入予定</option><option value="acquired">仕入済み</option><option value="preparing">出品準備中</option><option value="listed">出品中</option><option value="sold">販売済み</option><option value="disposed">処分済み</option></select></div>
                </div>
                <div id="inventoryEmpty" class="alert alert-secondary">在庫はまだありません。</div>
                <div id="inventoryList" class="row g-3"></div>
            </section>
        </div>
    </main>
    {% include 'footer.html' %}
    <script src="{% static 'JS/csrf.js' %}?v=20260821-security"></script>
    <script src="{% static 'JS/InventoryManagement.js' %}?v=20260902-phase3a-2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
