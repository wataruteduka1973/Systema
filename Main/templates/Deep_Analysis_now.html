<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情報分析ツール システマ</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<style>
    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(135deg, #ffffff, #f9f9f9);
        color: #333;
        min-height: 100vh;
    }

    .hero-section {
        background: linear-gradient(135deg, #ff4d4d, #ff8c8c);
        color: #fff;
        padding: 5rem 1rem;
        text-align: center;
        margin-bottom: 2rem;
    }

    .hero-section h1 {
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 1rem;
    }

    .btn-custom {
        background-color: #000000;
        border: 1px solid #ced4da;
        color: #ffffff;
        padding: 0.5rem 1rem;
        font-size: 1.1rem;
    }

    .btn-custom:hover {
        background-color: #343a40;
        color: #ffffff;
    }

    .btn-custom .bi-search- {
        color: #ffffff;
    }


    .search-container {
        max-width: 100%;
        padding: 0 1rem;
    }

    #medianPriceBox {
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 1rem;
        background-color: #f3f3f3;
    }

    @media (max-width: 768px) {

        .input-group {
            min-width: 150px;

        }

        #dataTableContainer {
            overflow-x: auto;
        }
    }
</style>

<body>
    {% include 'header.html' %}
    <main role="main">
        <section class="hero-section">
            <div class="container">
                <h1>ターゲット分析</h1>
                <p class="lead">出品中の商品を統計的に分析して狙い目の商品をピックアップして表示します</p>
            </div>
        </section>
        <div class="container search-container">
            <div class="form-group mt-4 d-flex gap-2 align-items-center">
                <h3>関連項目</h3>
                <a href="{% url 'yahuoku_now' %}" class="btn btn-danger">相場検索</a>
                <a href="{% url 'yahuoku_now' %}" class="btn btn-danger">現在価格検索</a>
                <a href="{% url 'Yahuoku_prediction' %}" class="btn btn-danger">相場予想</a>
            </div>
            <div class="row justify-content-center search-button">
                <h2>キーワードの行間を開けると詳細に検索できます</h2>
                <div class="col-12">
                    <div class="col-md-8">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" id="search" placeholder="検索キーワード"
                                aria-label="検索キーワード" aria-describedby="button-search">
                            <button class="btn btn-custom" type="button" id="button-search" onclick="TargetSearch()">
                                <span class="spinner-border spinner-border-sm" role="status" id="searchSpinner"
                                    style="display: none;"></span>
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                    class="bi bi-search" viewBox="0 0 16 16">
                                    <path
                                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="container mt-3">
            <div class="alert alert-info text-center" id="medianPriceBox" style="display:none;">
                平均落札価格: <span id="medianPrice"></span> 円
            </div>
        </div>
        <div id="dataTableContainer">
            <div class="Main-Element">
                <div id="dataTableContainer">
                    <table id="dataTable" class="table table-striped table-hover table-container">
                        <thead>
                            <tr>
                                <th style="width:200px;">商品名</th>
                                <th style="width:150px;">現在価格</th>
                                <th style="width:150px;">入札</th>
                                <th style="width:150px;">残り時間</th>
                                <th style="width:200px;">URL</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    {% include 'footer.html' %}
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="{% static 'JS/Deep_Analysis_now.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
