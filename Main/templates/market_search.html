{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>市場検索 | 情報分析ツール システマ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f8f9fa;color:#212529 }.market-hero { background:linear-gradient(135deg,#b91c1c,#ef4444);color:#fff;padding:2.5rem 1rem }
        .mode-panel { margin-top:-1.5rem;background:#fff;border-radius:1rem;box-shadow:0 8px 24px rgba(0,0,0,.1);padding:.75rem }
        .mode-button { border-radius:.75rem;padding:.85rem 1.25rem;font-weight:600 }.mode-button[aria-selected="true"] { background:#dc3545;border-color:#dc3545;color:#fff }
        .content-card { background:#fff;border-radius:1rem;box-shadow:0 4px 18px rgba(0,0,0,.08) }.summary-card { border-left:5px solid #dc3545 }
        .table-responsive { min-height:240px }#resultTable th { white-space:nowrap }
    </style>
</head>
<body data-active-mode="{{ active_mode }}">
{% include 'header.html' %}
<main>
    <section class="market-hero text-center"><div class="container"><h1 class="h2 mb-2">市場検索</h1><p class="mb-0">現在の出品、落札相場、保存済みデータを同じ条件と結果表で確認できます。</p></div></section>
    <div class="container pb-5">
        <section class="mode-panel mb-4" role="tablist" aria-label="検索モード"><div class="row g-2">
            {% for mode in modes %}<div class="col-12 col-md-4"><button type="button" class="btn btn-outline-danger mode-button w-100" role="tab" data-mode="{{ mode.key }}" aria-selected="{% if mode.key == active_mode %}true{% else %}false{% endif %}">{{ mode.label }}</button></div>{% endfor %}
        </div></section>
        <section class="content-card p-3 p-md-4 mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-lg-8" id="keywordSearchGroup"><label class="form-label fw-bold" for="marketKeyword">検索キーワード</label><div class="input-group"><input id="marketKeyword" class="form-control" maxlength="100" placeholder="例: ミラーレスカメラ"><button id="marketSearchButton" class="btn btn-danger" type="button"><span id="marketSearchSpinner" class="spinner-border spinner-border-sm me-1 d-none" aria-hidden="true"></span>検索</button></div></div>
                <div class="col-12 col-lg-8 d-none" id="historySearchGroup"><label class="form-label fw-bold" for="historyKeyword">保存済み検索キーワード</label><select id="historyKeyword" class="form-select"><option value="">選択してください</option></select></div>
                <div class="col-12 col-lg-4 d-flex flex-wrap gap-2 d-none" id="historyActions"><button id="historyLoadButton" class="btn btn-info" type="button">読み込む</button><button id="historyUpdateButton" class="btn btn-outline-primary" type="button">再取得</button><button id="historyDeleteButton" class="btn btn-outline-danger" type="button">削除</button></div>
            </div>
            <div id="popularWords" class="d-flex flex-wrap gap-2 mt-3" aria-label="よく使われるキーワード"></div><div id="marketMessage" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></div>
        </section>
        <section class="content-card p-3 p-md-4 mb-4"><h2 class="h5 mb-3">絞り込み</h2><div class="row g-3 align-items-end">
            <div class="col-6 col-md-3"><label class="form-label" for="minimumPrice">最低価格</label><input id="minimumPrice" type="number" min="0" value="0" class="form-control"></div>
            <div class="col-6 col-md-3"><label class="form-label" for="maximumPrice">最高価格</label><input id="maximumPrice" type="number" min="0" class="form-control" placeholder="上限なし"></div>
            <div class="col-8 col-md-3"><label class="form-label" for="conditionFilter">商品状態</label><select id="conditionFilter" class="form-select"><option value="">すべて</option><option value="new">新品・未使用</option><option value="used">中古・動作品</option><option value="junk">ジャンク・故障品</option><option value="unknown">未分類</option></select></div>
            <div class="col-4 col-md-3 d-grid"><button id="resetFilters" class="btn btn-outline-secondary">リセット</button></div>
        </div></section>
        <section class="content-card p-3 p-md-4"><div class="summary-card bg-light rounded p-3 mb-3"><div id="resultSummary" class="fw-bold">検索条件を入力してください。</div><div id="resultDetail" class="small text-muted mt-1"></div></div>
            <div class="table-responsive"><table id="resultTable" class="table table-striped table-hover align-middle"><thead><tr><th>商品名</th><th id="priceHeading">価格</th><th>開始価格</th><th>入札数</th><th id="timeHeading">取得情報</th><th>商品状態</th><th>URL</th></tr></thead><tbody></tbody></table></div>
            <nav aria-label="検索結果ページ"><ul id="resultPagination" class="pagination justify-content-center mb-0"></ul></nav>
        </section>
    </div>
</main>
{% include 'footer.html' %}
<script src="{% static 'JS/csrf.js' %}?v=20260821-security"></script><script src="{% static 'JS/MarketSearch.js' %}?v=20260821-unified"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
