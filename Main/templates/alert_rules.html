{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>アラート条件 | Systema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.alert-target-label { overflow-wrap: anywhere; }</style>
</head>
<body class="bg-light">
    {% include 'header.html' %}
    <main class="container py-4" style="max-width: 960px">
        <div class="mb-4">
            <h1 class="h2 mb-1">アラート条件</h1>
            <p class="text-muted mb-0">保存検索、ウォッチ商品、出品の判定条件と通知間隔を管理します。</p>
        </div>
        <section class="card mb-4" aria-labelledby="alertFormHeading">
            <div class="card-body">
                <h2 id="alertFormHeading" class="h5">条件を追加</h2>
                <form id="alertRuleForm" class="row g-3">
                    {% csrf_token %}
                    <input id="alertRuleId" type="hidden">
                    <div class="col-md-4"><label for="alertTargetType" class="form-label">対象種別</label><select id="alertTargetType" class="form-select"><option value="savedSearch">保存検索</option><option value="watchItem">ウォッチ商品</option><option value="sellerListing">出品</option></select></div>
                    <div class="col-md-8"><label for="alertTargetId" class="form-label">対象</label><select id="alertTargetId" class="form-select" required></select></div>
                    <div class="col-md-5"><label for="alertRuleType" class="form-label">条件</label><select id="alertRuleType" class="form-select" required></select></div>
                    <div class="col-md-3"><label for="alertThreshold" class="form-label">しきい値</label><input id="alertThreshold" class="form-control" type="number" min="0" step="0.0001" value="0" required><div id="thresholdHelp" class="form-text"></div></div>
                    <div class="col-md-2"><label for="alertCooldown" class="form-label">通知間隔（分）</label><input id="alertCooldown" class="form-control" type="number" min="1" value="60" required></div>
                    <div class="col-md-2 d-flex align-items-center"><div class="form-check mt-4"><input id="alertEnabled" class="form-check-input" type="checkbox" checked><label for="alertEnabled" class="form-check-label">有効</label></div></div>
                    <div class="col-12 d-flex flex-wrap gap-2"><button id="alertSubmit" class="btn btn-primary" type="submit">条件を追加</button><button id="alertCancel" class="btn btn-outline-secondary d-none" type="button">編集をやめる</button></div>
                </form>
                <div id="alertRuleMessage" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></div>
            </div>
        </section>
        <section aria-labelledby="alertListHeading">
            <h2 id="alertListHeading" class="h4">登録済みの条件</h2>
            <div id="alertRuleList" class="d-grid gap-3" aria-live="polite"></div>
        </section>
    </main>
    {{ alert_targets|json_script:"alert-target-data" }}
    <script src="{% static 'JS/csrf.js' %}?v=20260821-security"></script>
    <script src="{% static 'JS/AlertRules.js' %}?v=20260910-phase6"></script>
</body>
</html>
