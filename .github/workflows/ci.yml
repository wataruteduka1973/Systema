name: Continuous integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check Main System_Config tests
      - run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: systema_ci
          POSTGRES_USER: systema_ci
          POSTGRES_PASSWORD: systema_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U systema_ci -d systema_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_ENGINE: postgresql
      DB_NAME: systema_ci
      DB_USER: systema_ci
      DB_PASSWORD: systema_ci_password
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_SSLMODE: disable
      DB_CONN_MAX_AGE: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - run: coverage run -m pytest && coverage report

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - run: python -m pip show pytest-playwright playwright
      - run: python -c "import sys; print(sys.executable)"
      - run: python -m playwright install --with-deps --only-shell
      - run: python -m playwright install --list
      - run: python -m pytest -m e2e -v

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - run: sphinx-build -W --keep-going -b html document document/build/html
